spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ailead}
    username: ailead
    password: ailead_password
    driver-class-name: org.postgresql.Driver
  ai:
    model:
      chat: google-genai
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash

app:
  upload:
    max-file-size: 5MB

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
