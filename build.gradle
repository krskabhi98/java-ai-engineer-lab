plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'maven-publish'
}

group = 'com.AI'
version = '1.0.4'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory'
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

	implementation 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
	implementation 'org.apache.logging.log4j:log4j-core:3.0.0-beta3'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

publishing {
	repositories {
		maven {
			name = 'nexus'
			url = uri('http://172.31.43.26:8081/repository/ailead-maven-releases/')
			allowInsecureProtocol = true

			credentials {
				username = findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
				password = findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
			}
		}
	}

	publications {
		maven(MavenPublication) {
			artifact(tasks.named('bootJar'))
			groupId = project.group
			artifactId = 'ailead'
			version = project.version
		}
	}
}
